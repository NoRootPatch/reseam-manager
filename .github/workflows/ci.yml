name: ci

on:
   workflow_dispatch: 
    inputs:
      version:
        description: "Releases version:"
        required: true
        type: string

jobs:
  ci:
    if: ${{ !github.event.deleted }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    container:
      image: ghcr.io/reseam/ci:2026.11.19
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}      
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      RESEAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RESEAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RESEAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GMSCORE_KEYSTORE_B64: ${{ secrets.GMSCORE_KEYSTORE_B64 }}
      GMSCORE_KEYSTORE_PASSWORD: ${{ secrets.GMSCORE_KEYSTORE_PASSWORD }}
      GMSCORE_KEY_ALIAS: ${{ secrets.GMSCORE_KEY_ALIAS }}
      GMSCORE_KEY_PASSWORD: ${{ secrets.GMSCORE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.bun/install/cache
            ~/.npm
          key: deps-${{ hashFiles('**/Cargo.lock', '**/*.gradle.kts', '**/libs.versions.toml', '**/bun.lock', '**/package-lock.json') }}
          restore-keys: deps-

      - name: Fix Android 7 APIs
        run: |                          
              find . -name "ReseamApplication.kt" -exec sed -i 's/createNotificationChannels(/if (android.os.Build.VERSION.SDK_INT >= 26) createNotificationChannels(/g' {} +
              find . -name "Notifications.kt" -exec sed -i '/fun createNotificationChannels/,/{/ s/{/{ if (android.os.Build.VERSION.SDK_INT < 26) return;/' {} +
              find . -name "*.kt" -exec sed -i -E 's/([a-zA-Z0-9_.]*packageManager)\.canRequestPackageInstalls\(\)/(android.os.Build.VERSION.SDK_INT < 26 || \1.canRequestPackageInstalls())/g' {} +    
              for f in $(grep -rl "\.atomicMove(" . --include="*.kt"); do
                  sed -i 's/import io.github.vinceglb.filekit.atomicMove/import io.github.vinceglb.filekit.path/g' "$f"
                  grep -q "import io.github.vinceglb.filekit.path" "$f" || sed -i '1s/^/import io.github.vinceglb.filekit.path\n/' "$f"
                  printf '\nprivate suspend fun io.github.vinceglb.filekit.PlatformFile.atomicMove(destination: io.github.vinceglb.filekit.PlatformFile) { val s = java.io.File(this.path); val d = java.io.File(destination.path); d.parentFile?.mkdirs(); if (d.exists()) d.delete(); if (!s.renameTo(d)) { s.copyTo(d, true); s.delete() } }\n' >> "$f"
              done

      - name: Build libfixapi
        run: |
              cat << 'EOF' > /tmp/fixapi.c
              #include <jni.h>
              #include <string.h>
              #include <stdarg.h>
              #include <sys/mman.h>
              #include <unistd.h>
              static jmethodID mid;
              static struct JNINativeInterface orig;
              jmethodID hGet(JNIEnv *e, jclass c, const char *n, const char *s) {
                  if (n && s && !strcmp(n, "getParameterCount") && !strcmp(s, "()I")) {
                      jmethodID m = orig.GetMethodID(e, c, "getParameterTypes", "()[Ljava/lang/Class;");
                      if ((*e)->ExceptionCheck(e)) (*e)->ExceptionClear(e);
                      if (m) return (mid = m);
                  }
                  return orig.GetMethodID(e, c, n, s);
              }
              jint hCallV(JNIEnv *e, jobject o, jmethodID m, va_list a) {
                  if (mid && m == mid) { jarray r = (*e)->CallObjectMethod(e, o, mid); return r ? (*e)->GetArrayLength(e, r) : 0; }
                  return orig.CallIntMethodV(e, o, m, a);
              }
              jint hCallA(JNIEnv *e, jobject o, jmethodID m, const jvalue *a) {
                  if (mid && m == mid) { jarray r = (*e)->CallObjectMethod(e, o, mid); return r ? (*e)->GetArrayLength(e, r) : 0; }
                  return orig.CallIntMethodA(e, o, m, a);
              }
              jint hCall(JNIEnv *e, jobject o, jmethodID m, ...) {
                  va_list a; va_start(a, m); jint r = hCallV(e, o, m, a); va_end(a); return r;
              }
              JNIEXPORT jint JNICALL JNI_OnLoad(JavaVM *vm, void *res) {
                  JNIEnv *e = 0;
                  if ((*vm)->GetEnv(vm, (void**)&e, JNI_VERSION_1_6) == JNI_OK && e && *e) {
                      struct JNINativeInterface *t = (struct JNINativeInterface *)(*e);
                      orig = *t; long p = sysconf(_SC_PAGESIZE);
                      mprotect((void*)((uintptr_t)t & ~(p - 1)), p * 2, 3);
                      t->GetMethodID = hGet; t->CallIntMethod = hCall; t->CallIntMethodV = hCallV; t->CallIntMethodA = hCallA;
                  }
                  return JNI_VERSION_1_6;
              }
              EOF
              NDK=$(dirname $(find /opt /usr -name "aarch64-linux-android24-clang" 2>/dev/null | head -n 1))
              for kv in arm64-v8a:aarch64-linux-android24-clang armeabi-v7a:armv7a-linux-androideabi24-clang x86:i686-linux-android24-clang x86_64:x86_64-linux-android24-clang; do
                  mkdir -p "composeApp/src/androidMain/jniLibs/${kv%:*}"
                  "$NDK/${kv#*:}" -shared -fPIC -Os -s /tmp/fixapi.c -o "composeApp/src/androidMain/jniLibs/${kv%:*}/libfixapi.so"
              done
              find . -name "ReseamApplication.kt" -exec sed -i '/super\.onCreate()/a \        System.loadLibrary("fixapi")' {} +
              
      - run: just check

      - run: just release ${{ inputs.version }}
     
      - name: Patch mallopt in final APKs
        run: |
              cat << 'EOF' > Fix.java
              import java.io.*;
              import java.util.zip.*;

              public class Fix {
                  public static void main(String[] args) throws Exception {
                      byte[] pat = "mallopt\0".getBytes(), rep = "getpid\0\0".getBytes();
                      File inFile = new File(args[0]), outFile = new File(args[0] + ".tmp");
                      try (ZipFile zf = new ZipFile(inFile);
                           ZipOutputStream zos = new ZipOutputStream(new FileOutputStream(outFile))) {
                          var e = zf.entries();
                          while (e.hasMoreElements()) {
                              ZipEntry ze = e.nextElement();
                              String n = ze.getName();
                              if (n.startsWith("META-INF/") && (n.endsWith(".SF") || n.endsWith(".RSA") || n.endsWith(".DSA") || n.equals("META-INF/MANIFEST.MF"))) continue;
                              byte[] buf = zf.getInputStream(ze).readAllBytes();
                              if (n.endsWith(".so")) {
                                  for (int i = 0; i <= buf.length - pat.length; i++) {
                                      boolean m = true;
                                      for (int j = 0; j < pat.length; j++) if (buf[i + j] != pat[j]) { m = false; break; }
                                      if (m) {
                                          System.arraycopy(rep, 0, buf, i, rep.length);
                                          System.out.println("Patched mallopt in " + inFile.getName() + " -> " + n);
                                      }
                                  }
                              }
                              ZipEntry ne = new ZipEntry(n);
                              ne.setMethod(ze.getMethod());
                              if (ze.getMethod() == ZipEntry.STORED) {
                                  ne.setSize(buf.length);
                                  ne.setCompressedSize(buf.length);
                                  CRC32 crc = new CRC32();
                                  crc.update(buf);
                                  ne.setCrc(crc.getValue());
                              }
                              zos.putNextEntry(ne);
                              zos.write(buf);
                              zos.closeEntry();
                          }
                      }
                  }
              }
              EOF
              ZIPALIGN=$(find / -name zipalign 2>/dev/null | head -n 1)
              APKSIGNER=$(find / -name apksigner 2>/dev/null | head -n 1)
              for apk in $(find composeApp/build/release -name "*.apk"); do
                  java Fix.java "$apk"
                  "$ZIPALIGN" -f -p 4 "$apk.tmp" "$apk"
                  "$APKSIGNER" sign --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false --ks build/keystore.jks --ks-pass env:RESEAM_KEYSTORE_PASSWORD --ks-key-alias "$RESEAM_KEY_ALIAS" --key-pass env:RESEAM_KEY_PASSWORD "$apk"
                  rm -f "$apk.tmp" "$apk.idsig"
              done
       
      - name: Upload ARM APKs
        uses: actions/upload-artifact@v4
        with:
              name: Reseam-ARM-${{ inputs.version }}
              path: |
                composeApp/build/release/**/*arm*.apk                
              retention-days: 7

      - name: Upload x86 APKs
        uses: actions/upload-artifact@v4
        with:
              name: Reseam-x86-${{ inputs.version }}
              path: |
                composeApp/build/release/**/*x86*.apk                
              retention-days: 7
